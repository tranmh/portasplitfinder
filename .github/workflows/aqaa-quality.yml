        continue-on-error: true
      - name: npm audit (dependency, report only)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
  unit-sql-postgres:
    name: Unit tests (sql-postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      AQAA_PG_URL: postgres://aqaa:aqaa@localhost:5432/aqaa?sslmode=disable
      AQAA_PG_CONNECTION_STRING: Host=localhost;Port=5432;Database=aqaa;Username=aqaa;Password=aqaa
      DATABASE_URL: postgres://aqaa:aqaa@localhost:5432/aqaa?sslmode=disable
      AQAA_PG_JDBC_URL: jdbc:postgresql://localhost:5432/aqaa?user=aqaa&password=aqaa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.13
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Start PostgreSQL with pgTAP
        run: |-
          docker build -q -t aqaa-ci-postgres -f "$GITHUB_WORKSPACE/ci/sql/postgres-pgtap.Dockerfile" "$GITHUB_WORKSPACE/ci/sql"
          docker run -d --name aqaa-postgres -p 5432:5432 -e POSTGRES_USER=aqaa -e POSTGRES_PASSWORD=aqaa -e POSTGRES_DB=aqaa aqaa-ci-postgres
          for _ in $(seq 60); do docker exec aqaa-postgres pg_isready -h 127.0.0.1 -U aqaa -d aqaa && break; sleep 2; done
      - name: Install dependencies
        run: |- # zizmor: ignore[adhoc-packages] test tooling, pinned to exact versions
          RUNNER_TEMP_DIR="${RUNNER_TEMP:-${WORKSPACE_TMP:-/tmp}}"; export AQAA_TSQLT_DIR="${AQAA_TSQLT_DIR:-$RUNNER_TEMP_DIR/tsqlt}"
          mkdir -p test-reports
          if ! command -v squawk >/dev/null || ! python3 -c 'import sqlfluff, pymssql' 2>/dev/null; then python3 -m pip install sqlfluff==4.4.0 squawk-cli==2.67.0 pymssql==2.4.3; fi
      - name: Unit tests
        run: |-
          RUNNER_TEMP_DIR="${RUNNER_TEMP:-${WORKSPACE_TMP:-/tmp}}"; export AQAA_TSQLT_DIR="${AQAA_TSQLT_DIR:-$RUNNER_TEMP_DIR/tsqlt}"
          python3 ci/sql/aqaa-sql test postgres test-reports/unit.xml --level unit
      - if: always()
        name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-sql-postgres
          path: test-reports
          if-no-files-found: ignore
          retention-days: 14

<!-- Representative schema.org page (hand-built) using a single ld+json block that
     wraps nodes in @graph, with https:// availability. OBI blocks automated
     capture, so this is a representative variant to exercise the @graph path. -->
<html lang="de"><head><meta charset="utf-8"><title>Graph Klimagerät | OBI</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "item": {"name": "Technik", "@id": "https://www.obi.de/search/technik/"}}
      ]
    },
    {
      "@type": "Product",
      "url": "https://www.obi.de/p/9999002/graph-klimageraet",
      "name": "Graph Klimagerät",
      "sku": "9999002",
      "offers": {
        "@type": "Offer",
        "priceCurrency": "EUR",
        "price": "729.50",
        "availability": "https://schema.org/InStock"
      }
    }
  ]
}
</script>
</head><body><h1>Graph Klimagerät</h1></body></html>

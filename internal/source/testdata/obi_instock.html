üroräume geeignet. \n\n Technische Daten \n- Stromzufuhr: 220-240V, 1Ph, 50Hz \n- Kühlleistung (Standardbedingungen): 12000 Btu/h / 3,5 kW \n- Heizleistung (Standardbedingungen): 12000 Btu/h /3,5 kW \n- Energieeffizienzklasse: Kühlen / SEER A++/ 6,1 \n- Energieeffizienzklasse: Heizen / SCOP A+ / 4,0 \n- Raumgröße: bis zu [m2/m3] 42 m2 / 105 m3 \n- Innenraum-Luftstrom (Hi/Mi/Lo): 420/390/350 m3/h \n- Geräuschpegel in Innenräumen (Hi/Mi/Lo/Si) : 49/47/44/39 dB(A) \n- Schallleistungspegel in Innenräumen: 59 dB \n- Schalldruckpegel in Innenräumen und Silent Mode: 39 dB(A) \n- Schalldruckpegel im Außenbereich: 56 dB(A) \n- Schallleistungspegel im Außenbereich: 62 dB \n- Kältemittelschlauch (H x B x L): 2,7cm x 6cm x 200cm \n- Kältemittelschlauch trennbar: Nein \n- Außenumgebungstemperatur (Kühlen/Heizen): 0~45/ -10 ~24 °C \n- Verpackungsabmessungen (BxTxH): 575x745x850 mm \n- Innengerät Abmessungen (BxTxH): 518x340x646 mm \n- Innengerät Nettogewicht: 32,5 kg \n- Außengerät Abmessungen (BxTxH): 500x260x438 mm \n- Euro-Stecker: Ja \n- Außengerät Nettogewicht: 9,9 kg \n- Bruttogewicht / Nettogewicht Innen- und Außengerät: 55,5/ 45,5 kg\n\nLieferumfang:\n- 1 Innengerät / Außengerät \n- 1 Halterung \n- 1 Fensterabdichtung \n- 1 Fensterverschluss","sku":"8620890","gtin13":"4048164116478","image":[{"@context":"http://schema.org","@type":"ImageObject","url":"https://bilder.obi.de/48fc77d9-f3cf-4ddc-a606-145986523c3f/prZZK/image.png","name":"Midea mobile Split-Klimaanlage PortaSplit","width":"1500","height":"1500","description":"Die Midea Split-Klimaanlage PortaSplit vereint die Vorteile von mobilen- und von fest verbauten Split-Klimaanlagen. Ob Heizen oder Kühlen, das Klimagerät wird mit der PortaSplit Technologie all deinen Ansprüchen gerecht und schafft das von dir gewünschte Klima. \n Innovatives Klimagerät mit PortaSplit Funktion\nDank innovativer PortaSplit Technologie wird bei der Midea Klima Splitanlage die warme Luft per Wärmetauscher abgeführt, ohne dass die Luft nach a

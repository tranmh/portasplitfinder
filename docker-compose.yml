services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    healthcheck:
      # mailhog image is minimal; check the HTTP UI port with the bundled wget.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8025/"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: ${API_PORT}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_TLS: ${SMTP_TLS}
      SOURCES: ${SOURCES}
    ports:
      - "${API_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/api", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  poller:
    build:
      context: .
      dockerfile: cmd/poller/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POLL_INTERVAL: ${POLL_INTERVAL}
      POLLER_HEALTH_PORT: ${POLLER_HEALTH_PORT}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_TLS: ${SMTP_TLS}
      SOURCES: ${SOURCES}
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_healthy
      # Wait for the API to be healthy: it seeds the full source/product/store
      # catalogue on boot, which the poller's snapshots reference (FK). This makes
      # the very first poll succeed on a cold, unattended `docker compose up`.
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/poller", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "${WEB_PORT}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  pgdata:
